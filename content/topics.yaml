    hashtags_fixed: []
  - id: "tmvgczjo2"
    name: "منهجيات إدارة المشاريع (Agile vs Waterfall)"
    description: "إليك باقة مواضيع متخصصة في علم الإدارة وإدارة المشاريع (Project Management)، مصممة لتناسب قوالب السوشيال ميديا وأسلوب الشرائح والنصائح المركزة:\n\n1. منهجيات إدارة المشاريع (Agile vs Waterfall)\n«متى تختار Agile ومتى تلتزم بـ Waterfall؟»\n\nالفكرة: مقارنة مبسطة توضح أن أجايل ليست الحل السحري لكل مشروع، وتحديد المشاريع التي تتطلب خطة ثابتة ومسبقة.\n\nالقالب المقترح: إنفوجرافك أو جدول مقارنة في كاروسيل.\n\n«أشهر 4 أخطاء في تطبيق Scrum تحول الاجتماعات إلى مضيعة للوقت»\n\nالفكرة: مناقشة الـ Daily Standup، وحشو المهام في الـ Sprint، وإهمال الـ Retrospective.\n\nالقالب المقترح: كاروسيل من 5 شرائح."
    audience: ""
    tone: ""
    hashtags_fixed: []
  - id: "tmvgczrg1"
    name: "إدارة الفرق والقيادة (Leadership & Team Dynamics)"
    description: "«الفرق بين المدير التنفيذي والقائد التقني (Manager vs Leader)»\n\nالفكرة: كيف تنتقل من مجرد متابعة المهام وتوزيع التذاكر إلى تمكين الفريق وحل العقبات.\n\nالقالب المقترح: شريحة اقتباس أو كاروسيل مقارنة بصرية.\n\n«كيف تتعامل مع زحف نطاق العمل (Scope Creep) دون خسارة العميل؟»\n\nالفكرة: استراتيجيات احترافية لإدارة طلبات التعديل المستمرة وتوثيق متطلبات التغيير (Change Requests).\n\nالقالب المقترح: نصيحة عملية أو خطوات متسلسلة."
    audience: ""
