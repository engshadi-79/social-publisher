  - id: "tmvgcv3kj"
    name: "تطبيقات الذكاء الاصطناعي في تطوير الويب والأنظمة (Technical & How-To)"
    description: "«كيف تدمج الذكاء الاصطناعي داخل موقعك بخطوات بسيطة؟»\n\nالفكرة: شرح ربط APIs (مثل Gemini أو OpenAI) بالواجهة الخلفية (Backend).\n\nالقالب المقترح: كاروسيل (خطوات عملية وأكواد توضيحية).\n\n«من قاعدة بيانات عادية إلى بحث دلالي ذكي (Semantic Search)»\n\nالفكرة: كيف تبني بحثاً يفهم المعنى ولا يبحث فقط عن الكلمات المطابقة حرفياً عبر Vector Databases.\n\n«أفضل 5 أدوات برمجية للـ AI يجب أن يجربها كل مطور اليوم»\n\nالفكرة: استعراض أدوات مثل Cursor, GitHub Copilot, v0.dev وغيرها.\n\nالقالب المقترح: إنفوجرافك أو كاروسيل سريع."
    audience: "الكل"
    tone: ""
    hashtags_fixed: []
    paused: true
  - id: "tmvgcvmh5"
    name: "نصائح للمطورين والمبتدئين (Mindset & Career)"
    description: "«هل ستحل أدوات الذكاء الاصطناعي محل المبرمجين؟»\n\nالفكرة: توضيح الفرق بين \"كتابة الكود\" و\"هندسة وتصميم وبناء الحلول\"، مع التركيز على أن المبرمج الذي يستخدم الذكاء الاصطناعي سيتفوق على من لا يستخدمه.\n\nالقالب المقترح: منشور نقاشي / ثريد على Threads + نصيحة على إنستغرام.\n\n«3 أخطاء شائعة عند الاعتماد على الذكاء الاصطناعي في كتابة الأكواد»\n\nالفكرة: مشاكل أمن البيانات (Security vulnerabilities)، الهلوسة في المكتبات، والاعتماد الأعمى دون مراجعة معمارية النظام.\n\nالقالب المقترح: كاروسيل من 5 شرائح.\n\n«كيف تصيغ البرومبت (Prompt) البرمجي لتحصل على كود نظيف وخالٍ من الأخطاء؟»\n\nالفكرة: نصائح عملية لصياغة تعليمات واضحة لأدوات الذكاء الاصطناعي."
    audience: ""
    tone: ""
    hashtags_fixed: []
    paused: true
  - id: "tmvgcw0d5"
    name: "دراسات حالة وأتمتة الأعمال (Business & Automation)"
    description: "«كيف بنيت نظام نشر آلي للسوشيال ميديا بواسطة الذكاء الاصطناعي؟» (Behind the Scenes)\n\nالفكرة: استعراض مشروع Social Publisher نفسه كدراسة حالة حقيقية تُظهر للعملاء والمتابعين قدرتك على ربط الأدوات (APIs، الجدولة، توليد المحتوى، القوالب).\n\nالقالب المقترح: كاروسيل دراسة حالة (المشكلة، الفكرة، التنفيذ، النتيجة).\n\n«أتمتة خدمة العملاء: متى تحتاج شات بوت ذكي، ومتى يكفيك الرد التلقائي العادي؟»\n\nالفكرة: توجيه أصحاب الأعمال والمشاريع لكيفية اتخاذ القرار الصحيح في أنظمتهم."
    audience: ""
    tone: ""
    hashtags_fixed: []
    paused: true
  - id: "tmvgcw9c3"
    name: "اقتباسات سريعة وتفاعل خفيف (Quotes & Engagement)"
    description: "«الذكاء الاصطناعي أداة لتسريع يدك، لكن عقلك وتفكيرك الهندسي هو الذي يقود المشروع.»\n\n«سؤال للمطورين: ما هي أكثر مهمة روتينية مملة في مشروعك تتمنى لو يؤديها عنك الذكاء الاصطناعي بالكامل؟»"
