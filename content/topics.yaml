topics:
  - id: "pillar-automation"
    name: "أتمتة العمل اليدوي لأصحاب الأعمال"
    pillar: "automation"
    description: "محور الجذب. يخاطب صاحب عمل صغير أو متوسط يقضي ساعات في إكسل وواتساب وتذكيرات يدوية. كل منشور يلتقط ألماً يومياً محدداً (متابعة طلبات، فواتير، حجوزات، تقارير، رد على استفسارات متكررة، جرد، متابعة موظفين) ويعرض كيف تتحول هذه الخطوة إلى نظام يعمل وحده، بأمثلة من يوم عمل حقيقي. ممنوع الشرح التقني؛ لغة صاحب العمل: وقت، تكلفة، أخطاء، فوضى."
    audience: "أصحاب المتاجر والشركات والمشاريع الصغيرة والمتوسطة في العالم العربي"
    tone: "عملية ومباشرة وواثقة، بلغة صاحب العمل لا المبرمج، بلا مصطلحات تقنية معقدة"
    hashtags_fixed: []
  - id: "pillar-casestudies"
    name: "قصص مشاريع حقيقية خلف الكواليس"
    pillar: "case"
    description: "محور الثقة. يشرح كيف صُمّمت أنظمة بناها المهندس فعلاً، مع التركيز على القرارات التصميمية والمشكلة التي يحلها كل نظام. الحقائق المسموح بها فقط: (1) نظام لإدارة مخيم ومتابعة المساعدات: يحفظ بيانات العائلات وأفرادها، ويسجّل كل مساعدة وجهتها ونوعها وتاريخها، ويعرف من استلم ومن لم يستلم، ويعمل أونلاين وأوفلاين مع مزامنة تلقائية عند عودة الإنترنت، وله صلاحيات مرنة لكل موظف، ولا يحذف البيانات فعلياً (أرشفة فقط)، وفيه نسخ احتياطي. (2) لوحة إحصاءات لمركز تدريب تعرض أرقام الدورات والمشاركين. (3) متجر إلكتروني وقالب متجر على منصة زد. (4) تطبيق قرآن. (5) نظام نشر اجتماعي آلي مجاني بالكامل يولّد المنشورات والفيديو وينشرها بعد موافقة صاحبه. قواعد صارمة: لا تذكر أسماء عائلات أو أفراد أو جهات أو عملاء ولا أي بيانات حساسة. ممنوع اختلاق شخصيات أو حوارات أو قصص عن عميل أو قرارات أو نتائج أو أرقام. تحدّث عمّا يفعله النظام ولماذا صُمّم هكذا، لا عمّا حدث مع العميل."
    audience: "أصحاب أعمال ومؤسسات يبحثون عمّن يبني لهم نظاماً أو موقعاً أو متجراً أو تطبيقاً"
    tone: "صادقة بصيغة المتكلم، تواضع واثق، شرح لماذا اتُّخذ كل قرار تصميمي"
    hashtags_fixed: []
  - id: "pillar-ai-business"
    name: "الذكاء الاصطناعي العملي لأصحاب الأعمال"
    pillar: "ai"
    description: "محور السلطة. استخدامات عملية ومجانية أو منخفضة التكلفة للذكاء الاصطناعي في إدارة العمل: كتابة المحتوى، خدمة العملاء، تلخيص الاجتماعات، تنظيم البيانات، أتمتة النشر. أمثلة قابلة للتجربة اليوم، مع تنبيه صريح لحدود الذكاء الاصطناعي وأخطائه الشائعة. يُسمح بالإشارة إلى أن نظام النشر هذا نفسه بُني مجاناً بالكامل."
    audience: "أصحاب أعمال وعاملون مستقلون يريدون توفير الوقت دون فريق تقني"
    tone: "حماسية مدروسة، أمثلة قابلة للتطبيق فوراً، بلا مبالغات أو وعود خيالية"
    hashtags_fixed: []
