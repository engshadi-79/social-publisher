  platforms:
    facebook: "كل مرة أبدأ مشروعاً أجد نفسي أضيّع أول ساعاته في أمور أكررها: هيكلة الملفات، وأكواد أعرفها عن ظهر قلب 😅\nفسألت نفسي: ماذا لو سلّمت هذا الروتين لمساعد ذكي، وركّزت أنا على القرار؟\n\n✦ أشرح له ما أريد بجملة واضحة ليبدأ بالمسودة الأولى\n✦ أراجع كل سطر وأفهم لماذا كُتب هكذا قبل أن أعتمده\n✦ أجعله يشرح لي ما لا أفهمه، فهو معلّم صبور لا يملّ\n✦ والقرار النهائي يبقى لي أنا، فالمهندس يقود والأداة تسرّع\n\nاسحب للآخر ← وقل لي: ما أول مهمة ستسلّمها لمساعدك الذكي؟\n\n#الذكاء_الاصطناعي #برمجة #تطوير_الويب #تقنية #مهندس"
