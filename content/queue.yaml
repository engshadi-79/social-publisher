    body: ''
    slides:
    - kicker: تطوير الأنظمة الذكية
      title: كيف تجعل البحث في موقعك يفهم المعنى لا الحروف؟
      body: دليل عملي لنقل نظام البحث التقليدي إلى بحث دلالي ذكي (Semantic Search) خطوة بخطوة.
      points:
      - الفرق بين مطابقة الحروف وفهم النية
      - تحويل النصوص إلى متجهات رقمية
      - ربط قاعدة بيانات متجهة بسرعة وكفاءة
    - kicker: المشكلة الحقيقية
      title: لماذا يفشل البحث التقليدي مع المستخدمين؟
      body: البحث العادي بـ SQL يعتمد على تطابق الكلمات؛ إذا كتب العميل 'هاتف بطاريته تدوم طويلاً' لن يظهر له شيء إلا إذا كان الوصف يطابق كلماته حرفياً.
      points:
      - تجاهل تام للمترادفات والمعاني
      - نتائج صفرية عند اختلاف التعبير
      - تجربة بحث محبطة تقلل التفاعل
    - kicker: الخطوة الأولى
      title: تحويل نصوص الموقع إلى تضمينات (Embeddings)
      body: أرسل نصوص المنتجات أو المقالات إلى نموذج ذكاء اصطناعي (مثل OpenAI أو Gemini) ليحول كل نص إلى مصفوفة أرقام تمثل جوهر المعنى وسياقه.
      points:
      - استخدام نموذج Embeddings مخصص
      - تمثيل الجمل رياضياً داخل فضاء دلالي
      - تحديث المتجهات عند إضافة محتوى جديد
    - kicker: الخطوة الثانية
      title: تخزين المتجهات في Vector Database
      body: بدلاً من الجداول التقليدية، احفظ هذه المصفوفات في قاعدة بيانات موجهة تبحث عبر حساب المسافات الرياضية وتلتقط المعاني المتقاربة في أجزاء من الثانية.
      points:
      - أدوات متخصصة مثل Pinecone أو Qdrant
      - أو تفعيل إضافة pgvector على PostgreSQL
      - استعلام فوري دون إرهاق الخادم
    - kicker: الخطوة الثالثة
      title: معالجة استعلام المستخدم وإظهار النتيجة
      body: عندما يكتب المستخدم سؤاله، حول كلماته لمتجه بنفس النموذج، واطلب من قاعدة البيانات استرجاع المحتوى الأقرب هندسياً لمعنى سؤاله.
      points:
      - مقارنة المتجهات بحساب تشابه الزوايا
      - عرض النتائج الأكثر صلة بالنية
      - استيعاب الأخطاء الإملائية واللهجات
    - kicker: الخلاصة والتطبيق
      title: هل جربت دمج البحث الدلالي في مشاريعك البرمجية؟
      body: 'احفظ هذا الدليل لتطبقه في مشروعك القادم، وشاركني في التعليقات: ما أكبر عقبة تواجهك عند دمج أدوات الذكاء الاصطناعي مع أنظمتك؟'
      points: []
    style: blueprint
    seed: 1
  platforms:
    facebook: 'اسحب للآخر ⬅️

      قبل فترة كنت أعمل على متجر إلكتروني، واشتكى العميل أن الزوار يبحثون عن عبارات مثل "ملابس مريحة للعمل" وتظهر لهم نتائج فارغة، مع أن المتجر مليء بالملابس الرسمية المريحة لكنها مسجلة بأسماء تقليدية!


      هنا يظهر عجز محركات البحث القديمة القائمة على مطابقة الحروف، والحل كان الانتقال إلى البحث الدلالي (Semantic Search):

      ✦ تحويل أوصاف المنتجات إلى متجهات رياضية (Embeddings) تختزل المعنى الفعلي للكلمة وسياقها.

      ✦ حفظ هذه المتجهات في قاعدة بيانات مخصصة مثل Qdrant أو إضافة pgvector إلى قاعدة بيانات PostgreSQL.

      ✦ تحويل استعلام المستخدم فورياً ومقارنة المسافات الرياضية لتقديم أقرب المعاني لطلبه حتى لو لم يتطابق حرف واحد.


      النتيجة كانت ارتفاعاً ملحوظاً في وصول المستخدمين للمنتجات وتحسن المبيعات من دون تعديل سطر واحد في الأوصاف القديمة.


      هل بدأت في اختبار قواعد البيانات المتجهة في أنظمتك؟

