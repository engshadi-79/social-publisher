      title: غير مهم وغير عاجل؟ احذفه بلا تردد!
      body: كل مهمة لا تضيف قيمة لمشروعك ولا تملك موعداً نهائياً مصيرها الإلغاء فوراً.
      seconds: 3.0
    - kicker: سؤال لك
      title: أي مربع يأخذ أغلب ساعات يومك؟
      body: شاركنا تجربتك في التعليقات، واحفظ الفيديو للرجوع إليه عند التخطيط القادم.
      seconds: 3.0
    hue: 250
    seed: 1
  platforms:
    facebook: 'هل تقضي يوم عملك كأنك في وحدة إطفاء تتنقل بين أزمة وأخرى؟


      السر ليس في كثرة ساعات العمل، بل في «مصفوفة أيزنهاور» لترتيب الأولويات:


      1. عاجل ومهم: نفّذه الآن (أزمات، تسليمات نهائية حاسمة).

      2. مهم وغير عاجل: خطط له وحدد موعده (التطوير، التخطيط، بناء الفريق).. هذا هو المربع الذي يبني مستقبلك ويمنع الأزمات قبل حدوثها!

      3. عاجل وغير مهم: فوّضه (مهام روتينية ومقاطعات يمكن لغيرك إنجازها).

      4. غير مهم وغير عاجل: احذفه تماماً (مضيعات الوقت والمهام الهامشية).


      المحترف الحقيقي يقضي أغلب وقته في المربع الثاني ليقلل تلقائياً من حرائق المربع الأول.


      جرّب اليوم فرز مهامك، ولاحظ كيف يتغير إنجازك وهدوء ذهنك تماماً.


      #إدارة_المشاريع #إنتاجية #مصفوفة_أيزنهاور #تطوير_الذات #المهندس_شادي'
