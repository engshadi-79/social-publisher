      أمّا القرار الثاني فكان أمان البيانات؛ حيث أُلغي الحذف النهائي تماماً واُستعيض عنه بالأرشفة التلقائية لحفظ التاريخ الإغاثي، مع تخصيص صلاحيات مرنة لكل موظف ونظام نسخ احتياطي مستمر.


      هل يعتمد نظام عملك الحالي على الاتصال الدائم بالإنترنت؟


