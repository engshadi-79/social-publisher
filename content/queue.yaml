  image:
    title: كيف يواصل نظامك العمل في الميدان بدون إنترنت؟
    body: قرارات تصميمية في بناء نظام لإدارة المخيمات والمساعدات
    points:
    - عمل أوفلاين كامل مع مزامنة تلقائية عند عودة الشبكة
    - معرفة دقيقة لمن استلم المساعدة ومن لم يستلمها
    - أرشفة السجلات بدلاً من الحذف الفعلي لمنع الأخطاء
    - صلاحيات مرنة لكل موظف مع نسخ احتياطي دوري
    format: qa
    series: سين جيم الأنظمة
    style: glass
    hue: 140
    seed: 1
  platforms:
    facebook: 'انقطاع الإنترنت في موقع العمل الميداني ليس عذراً لتوقف التوثيق أو تعطّل توزيع المساعدات.


      عندما صممتُ نظام إدارة المخيم ومتابعة المساعدات، جعلتُ العمل بدون إنترنت أولوية أساسية؛ يسجل الموظف بيانات العائلات وأفرادها، ويوثق نوع المساعدة وجهتها وتاريخها، ويعرف بدقة من استلم ومن ينتظر، دون الحاجة للاتصال بالشبكة. وبمجرد عودة الإنترنت، يُزامن النظام البيانات تلقائياً مع السيرفر.


      واتخذتُ قراراً تصميمياً آخر بحماية البيانات من أخطاء المستخدمين؛ فالنظام لا يحذف أي قيد نهائياً بل ينقله للأرشيف فقط، مع توزيع صلاحيات مخصصة لكل موظف وتفعيل النسخ الاحتياطي التلقائي. البرمجيات التي تخدم الواقع تُبنى بافتراض أسوأ الظروف لا أفضلها.


      هل تفضل في برامج عملك الاعتماد الكامل على السحابة أم توفير وضع الأوفلاين؟

