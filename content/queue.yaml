    title: 'قاعدة الدقيقتين: سر التخلص من التسويف'
    body: إذا كانت المهمة تحتاج أقل من دقيقتين، أنجزها فوراً ولا تؤجلها.
    photo_query: minimalist desk planner coffee
    seed: 1
  platforms:
    facebook: 'أهلاً بكم! كثيراً ما تتراكم علينا مهام صغيرة نظنها تافهة، مثل الرد على رسالة مهمة، أو ترتيب ورقة على المكتب، أو كتابة تذكير سريع. المشكلة ليست في صعوبتها، بل في أنها تظل تدور في عقلك وتستهلك طاقتك وتشعرك بضغط مستمر.


      الحل البسيط هو «قاعدة الدقيقتين»: أي شيء يمر أمامك ولا يتطلب إنجازه أكثر من 120 ثانية، قُم به الآن مباشرة دون إضافته لقائمة الانتظار. ستكتشف أن نصف المهام المزعجة تختفي في لحظتها، ويبقى ذهنك صافياً للمشاريع الكبيرة التي تستحق تركيزك الكامل.


      جرّب تطبيقها من هذه اللحظة على أول مهمة صغيرة مؤجلة، ولاحظ كيف يتغير يومك!


      #تنظيم_الوقت #تطوير_الذات #إنتاجية #نصائح_يومية #إنجاز'
