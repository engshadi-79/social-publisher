    body: حوّل المتابعة المالية من همّ يومي إلى نظام يعمل وحده.
    points:
    - كشف الفواتير المستحقة تلقائياً دون مراجعة يدوية
    - إرسال تذكيرات سداد مخصصة للعملاء عبر واتساب
    - تحديث حالة الحساب فور استلام الحوالة
    - تقرير مالي يومي يصلك دون كتابة سطر واحد
