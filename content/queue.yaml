    body: حوّل ملاحظاتك المبعثرة إلى رسائل مهنية في ثوانٍ مجاناً
    points:
    - اكتب ملاحظاتك كنقاط سريعة دون صياغة مسبقة
    - اطلب من الذكاء ترتيبها في قالب متابعة احترافي
    - 'انتبه: قد يخترع مواعيد لم تقلْها إذا لم تدقق'
    - راجع الأرقام والتواريخ دائماً قبل الإرسال للعميل
    format: goodbye
