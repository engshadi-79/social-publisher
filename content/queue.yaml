      title: عاجل لكن غير مهم.. فوّضه فوراً!
      body: إشعارات، اجتماعات مفاجئة، وطلبات روتينية؛ لا تدعها تسرق وقتك الثمين ووكّل غيرك بها.
      seconds: 3.5
