  platforms:
    facebook: 'تنهي مكالمة العميل، وتجلس 20 دقيقة لتتذكر ما اتفقتم عليه وتصيغ رسالة المتابعة؟


      كمهندس برمجيات أبني أنظمة لأصحاب الأعمال، لا أكتب هذه الرسائل من الصفر أبداً. بعد المكالمة مباشرة، أضع 4 أو 5 كلمات مبعثرة في محادثة مجانية مع الذكاء الاصطناعي (مثل النسخة المجانية من ChatGPT)، وأطلب منه: "حوّل هذه النقاط إلى رسالة بريد مهنية تبدأ بالشكر وتحدد الخطوة التالية وتاريخها، دون إضافة أي تفاصيل لم أذكرها".


      خلال ثوانٍ، تحصل على مسودة جاهزة وواضحة. حتى نظام النشر الذي تقرأ منه هذا المنشور الآن بنيته مجاناً بالكامل بنفس أسلوب الأتمتة البسيطة.


      لكن احذر هذا الفخ: أكبر خطأ شائع هو تركه "يكمل من رأسه"؛ فالنموذج قد يخترع مواعيد تسليم أو أسعاراً لم تنطق بها. قاعدة التحقق الذهبية: عينك على التواريخ والأرقام قبل زر الإرسال.


      كم رسالة متابعة ترسلها أسبوعياً لعملائك؟


