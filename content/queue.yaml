  platforms:
    facebook: 'أكبر فخ يقع فيه أي فريق عمل هو التفاؤل المفرط بافتراض أن كل خطوة ستسير بلا عقبات!


      إدارة المخاطر لا تعني التشاؤم، بل تعني الجاهزية والاحترافية. ببساطة، قسّم المخاطر عبر معادلة:

      (الاحتمالية × الأثر)


      1. الاحتمالية: ما فرصة وقوع هذه المشكلة؟ (منخفضة، متوسطة، مرتفعة).

      2. الأثر: إذا وقعت، ما حجم الضرر على المشروع؟


      اضرب الاثنين معاً؛ أي خطر يحمل احتمالية عالية وأثراً كبيراً هو قنبلة موقوتة تتطلب وضع خطة طوارئ (Plan B) فوراً، مثل تعطل مزود خدمة، أو نقص في الكفاءات.


      النجاح في المشاريع ليس في انعدام المشاكل، بل في امتلاك خطة تجعل الفريق يتعامل معها بهدوء وسرعة.


