<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم</title></head><body style="font-family:sans-serif;text-align:center;padding:40px;line-height:1.8"><div id="go"><a href="https://social-dashboard-cyan-mu.vercel.app/">انتقل إلى لوحة التحكم</a></div><div id="code" hidden><h2>كود التفويض جاهز ✅</h2><p>انسخه والصقه في نافذة PowerShell التي تنتظره:</p><textarea id="c" readonly style="width:min(92vw,560px);height:90px;font:16px monospace;direction:ltr"></textarea><p><button id="b" style="font-size:18px;padding:8px 22px">نسخ</button></p></div><script>var m=/[?&]code=([^&#]+)/.exec(location.search);if(m){document.getElementById("go").hidden=true;document.getElementById("code").hidden=false;var t=document.getElementById("c");t.value=decodeURIComponent(m[1]);t.select();document.getElementById("b").onclick=function(){t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}this.textContent="نُسخ ✓"}}else location.replace("https://social-dashboard-cyan-mu.vercel.app/");</script></body></html>
