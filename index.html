const b2u = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function open(pw) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b2u(DATA.salt), iterations: DATA.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b2u(DATA.iv) }, key, b2u(DATA.ct));
  return new TextDecoder().decode(buf);
}
async function enter(pw, remember) {
  const html = await open(pw);
  if (remember) { try { sessionStorage.setItem("dash_pw", pw); } catch (e) { /* الخصوصية تمنع التخزين: لا بأس */ } }
  document.open(); document.write(html); document.close();
}
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = "";
  try { await enter(document.getElementById("pw").value, true); }
  catch (x) { err.textContent = "كلمة المرور غير صحيحة."; btn.disabled = false; }
};
(async () => {
  let saved = null; try { saved = sessionStorage.getItem("dash_pw"); } catch (e) { /* لا شيء */ }
  if (saved) { try { await enter(saved, false); } catch (x) { try { sessionStorage.removeItem("dash_pw"); } catch (e) { /* لا شيء */ } } }
})();
</script>
