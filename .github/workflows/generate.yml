name: generate
on:
  push:
    branches: [main]
    paths:
      - content/generate_request.yaml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ hashFiles('content/generate_request.yaml') != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyyaml==6.0.2 requests==2.32.3 tzdata==2024.2
      - name: Generate draft posts
        working-directory: src
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py
      - name: Commit drafts and refresh dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "publisher-bot"
          git config user.email "publisher-bot@users.noreply.github.com"
          git add -A content
          if ! git diff --cached --quiet; then
            git commit -m "bot: generated drafts [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
          gh workflow run dashboard.yml
