name: daily-drafts
# كل يوم: منشور واحد لكل موضوع، مجدول 8 صباحاً من الغد، مسودة تنتظر موافقتك في اللوحة.
# مواعيد GitHub قد تتأخر ساعات، لكن التوليد لا يكرّر موضوعاً له منشور في ذلك اليوم، فتأخيره آمن.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "اليوم المستهدف YYYY-MM-DD (افتراضياً: غداً)"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyyaml==6.0.2 requests==2.32.3 tzdata==2024.2
      - name: Generate daily drafts
        working-directory: src
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_DATE: ${{ inputs.date }}
        run: python generate.py --daily $TARGET_DATE
      - name: Commit drafts and refresh dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "publisher-bot"
          git config user.email "publisher-bot@users.noreply.github.com"
          git add -A content
          if ! git diff --cached --quiet; then
            git commit -m "bot: daily drafts [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
          gh workflow run dashboard.yml
