name: refresh-tokens
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Refresh Threads token
        working-directory: src
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python refresh_tokens.py
      - name: Record refresh date
        run: |
          git config user.name "publisher-bot"
          git config user.email "publisher-bot@users.noreply.github.com"
          git add content/token_dates.json
          if ! git diff --cached --quiet; then
            git commit -m "bot: threads token refreshed [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
