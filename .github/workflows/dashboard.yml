name: dashboard
on:
  workflow_run:
    workflows: [publish]
    types: [completed]
  push:
    branches: [main]
    paths:
      - content/queue.yaml
      - content/topics.yaml
      - brand/**
      - templates/**
      - src/dashboard*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache Playwright browsers
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('requirements.txt') }}
      - run: playwright install --with-deps chromium
        if: steps.pw.outputs.cache-hit != 'true'
      - run: playwright install-deps chromium
        if: steps.pw.outputs.cache-hit == 'true'
      - name: Build and publish dashboard
        working-directory: src
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python dashboard.py --publish
